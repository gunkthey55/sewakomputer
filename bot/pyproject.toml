[project]
name = "rental-bot"
version = "1.0.0"
description = "Telegram bot for Computer Rental System - user interaction via chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==21.6",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.8",
    "ruff==0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"