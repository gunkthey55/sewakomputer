version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: rental-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rental_db}
      MYSQL_USER: ${MYSQL_USER:-rental_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rental_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rental-network

  redis:
    image: redis:7-alpine
    container_name: rental-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rental-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rental-backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-rental_user}:${MYSQL_PASSWORD:-rental_password}@mysql:3306/${MYSQL_DATABASE:-rental_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TZ: Asia/Jakarta
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rental-network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rental-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - rental-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: rental-bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BACKEND_API_URL=http://backend:8000
      - LOG_LEVEL=INFO
    depends_on:
      - backend
    networks:
      - rental-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  rental-network:
    driver: bridge
