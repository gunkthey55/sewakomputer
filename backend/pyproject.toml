[project]
name = "rental-backend"
version = "0.1.0"
description = "Rental Computer Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=3.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "B", "SIM", "RUF", "T20", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "FA", "FLY", "ISC", "ICN", "PIE", "TCH", "INT", "ARG", "RET", "ASYNC", "LOG", "PERF"]
ignore = ["E501", "ANN101", "ANN102", "ARG001", "ARG002", "SIM105", "PTH118", "PTH123"]
fixable = ["F", "I", "UP", "W", "C90", "SIM", "RUF", "T20", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "FA", "FLY", "ISC", "ICN", "PIE", "TCH", "INT", "ARG", "RET", "ASYNC", "LOG", "PERF"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true